<div class="wrapper stack">

<section class="panel flow page-intro">
<h1>安全カード</h1>
<p>よくある危険状況向けの短い防御ガイドです。</p>
</section>

<section class="display-settings" aria-label="表示設定" data-timezone-controls></section>

<section class="panel flow" aria-labelledby="card-controls-title-ja">
  <div class="section-heading">
    <div>
      <p class="badge">絞り込み</p>
      <h2 id="card-controls-title-ja">危険行動カードを探す</h2>
    </div>
    <p class="section-note">公開済みのカードデータを検索・絞り込みできます。</p>
  </div>

  <form class="filter-panel" data-card-controls>
    <label>検索 <input type="search" data-card-search placeholder="カードを検索..." /></label>
    <label>カテゴリ <select data-card-category></select></label>
    <label>重要度 <select data-card-severity></select></label>
    <label>対象読者 <select data-card-audience></select></label>
    <label>ソース種別 <select data-card-source-type></select></label>
    <button type="button" data-card-reset>絞り込みをリセット</button>
  </form>

  <p class="result-count" data-card-count></p>
</section>

<div id="card-list" class="card-grid" data-card-list></div>
<p class="empty-state" data-card-empty hidden>カードデータを読み込めませんでした。</p>

<section class="panel flow" data-card-detail hidden></section>
